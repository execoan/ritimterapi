<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunucuya Ulaşılamıyor — Ritim Atölyesi</title>
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif;background:#faf8f5;color:#1c1917;text-align:center;padding:24px">
  <div style="max-width:26rem">
    <div style="font-size:46px">🥁</div>
    <h1 style="font-size:22px;margin:12px 0 8px">Sunucuya Ulaşılamıyor</h1>
    <p style="color:#78716c;line-height:1.6;margin:0 0 20px">
      Şu anda sunucuya ulaşılamıyor. İnternet bağlantınızı kontrol edin.
      Uygulamayı kendi bilgisayarınızda çalıştırıyorsanız
      <strong>start.bat</strong> açık mı bakın; telefon/tabletten
      bağlanıyorsanız aynı Wi-Fi ağında olduğunuzdan emin olun.
    </p>
    <button id="yenile" style="padding:13px 26px;background:#d97706;color:#fff;border:0;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer">Tekrar Dene</button>
  </div>
  <!-- Satır içi on* yerine betik: CSP'de script-src 'unsafe-inline' kapalı;
       bu dosya statik sunuluyor diye ayrık kalmasın. -->
  <script>document.getElementById('yenile').addEventListener('click', function () { location.reload(); });</script>
</body>
</html>
