# Her push/PR'da duman testi: izole depoyla sunucu açar, işlev + güvenlik denetler.
name: Duman testi

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2 kur
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, mbstring
          coverage: none

      - name: Zamanlama ve öğrenme birim testlerini çalıştır
        run: |
          node test/zamanlama.test.js
          node test/ritim-ogrenme.test.js
          node test/metronom-cekirdegi.test.js
          node test/metronom-setlist.test.js
          node test/motor-koordinasyon.test.js
          node test/grup-atolyesi.test.js
          node test/poliritim.test.js
          node test/tini.test.js

      - name: Duman testini çalıştır
        run: |
          php test/statik.php
          php test/migration-v13.php
          php test/olcum.test.php
          php test/kilitli-dil.test.php
          php test/smoke.php
